name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  build:
    name: ${{ matrix.name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            platform: mac
            arch: arm64
            executable: release/mac-arm64/Taskline.app/Contents/MacOS/Taskline
          - name: macOS Intel
            os: macos-15-intel
            platform: mac
            arch: x64
            executable: release/mac/Taskline.app/Contents/MacOS/Taskline
          - name: Windows x64
            os: windows-2025
            platform: win
            arch: x64
            executable: release/win-unpacked/Taskline.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:${{ matrix.platform }} -- --${{ matrix.arch }}
      - name: Packaged application smoke test (no agents)
        if: matrix.platform == 'win'
        run: npm run test:e2e -- tests/release-smoke.e2e.mjs
        env:
          TASKLINE_TEST_APP: ${{ github.workspace }}/${{ matrix.executable }}
      - name: Packaged macOS E2E (isolated fixtures, no agents)
        if: matrix.platform == 'mac'
        run: >-
          npm run test:e2e --
          tests/release-smoke.e2e.mjs
          tests/project-cli.e2e.mjs
          tests/task-planning.e2e.mjs
          tests/thread-targets.e2e.mjs
          tests/composer.e2e.mjs
          tests/image-viewer.e2e.mjs
          tests/board-status.e2e.mjs
          tests/board-access.e2e.mjs
          tests/region-capture.e2e.mjs
        env:
          TASKLINE_TEST_APP: ${{ github.workspace }}/${{ matrix.executable }}
          TASKLINE_CAPTURE_FIXTURE: "1"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taskline-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.mjs
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: taskline-*
          path: release-assets
          merge-multiple: true
      - name: Include standalone CLI and checksums
        run: |
          cd release-assets
          sha256sum *.dmg *.zip *.exe *.mjs > SHA256SUMS.txt
      - name: Publish only after all platform builds pass
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Taskline $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
