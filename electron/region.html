<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #111;
        cursor: crosshair;
        font:
          13px -apple-system,
          sans-serif;
        user-select: none;
      }
      #screen {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
      }
      .shade {
        position: absolute;
        inset: 0;
        background: #0004;
        pointer-events: none;
      }
      #selection {
        display: none;
        position: absolute;
        border: 2px solid #aaa8ff;
        background: #aaa8ff14;
        box-shadow: 0 0 0 10000px #0003;
        pointer-events: none;
      }
      #hint {
        position: absolute;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        background: #19191fed;
        color: #f3f3f8;
        padding: 12px 20px;
        border: 1px solid #ffffff25;
        border-radius: 9px;
        box-shadow: 0 8px 35px #0005;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img id="screen" />
    <div class="shade"></div>
    <div id="selection"></div>
    <div id="hint">Drag to capture an area · Esc to cancel</div>
    <script>
      let start = null,
        rectangle = null;
      const box = document.getElementById("selection");
      window.taskline
        .regionImage()
        .then((image) => (document.getElementById("screen").src = image));
      document.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        start = { x: e.clientX, y: e.clientY };
        document.getElementById("hint").hidden = true;
      });
      document.addEventListener("mousemove", (e) => {
        if (!start) return;
        rectangle = {
          x: Math.min(start.x, e.clientX),
          y: Math.min(start.y, e.clientY),
          width: Math.abs(e.clientX - start.x),
          height: Math.abs(e.clientY - start.y),
        };
        Object.assign(box.style, {
          display: "block",
          left: rectangle.x + "px",
          top: rectangle.y + "px",
          width: rectangle.width + "px",
          height: rectangle.height + "px",
        });
      });
      document.addEventListener("mouseup", () => {
        if (rectangle && rectangle.width > 8 && rectangle.height > 8)
          window.taskline.finishRegion(rectangle);
        else window.taskline.cancelRegion();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") window.taskline.cancelRegion();
      });
    </script>
  </body>
</html>
