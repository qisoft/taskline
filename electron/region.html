<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #111;
        cursor: crosshair;
        font:
          13px -apple-system,
          sans-serif;
        user-select: none;
      }
      #screen {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
      }
      .shade {
        position: absolute;
        inset: 0;
        background: #0004;
        pointer-events: none;
      }
      #selection {
        display: none;
        position: absolute;
        border: 2px solid #aaa8ff;
        background: #aaa8ff14;
        box-shadow: 0 0 0 10000px #0003;
        pointer-events: none;
      }
      #hint {
        position: absolute;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        background: #19191fed;
        color: #f3f3f8;
        padding: 12px 20px;
        border: 1px solid #ffffff25;
        border-radius: 9px;
        box-shadow: 0 8px 35px #0005;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img id="screen" />
    <div class="shade"></div>
    <div id="selection"></div>
    <div id="hint">Drag to capture an area · Esc to cancel</div>
    <script type="module" src="./region.js"></script>
  </body>
</html>
